name: Publish Inna Volos

on:
  push:
    branches: [codex/launch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build optimized site
        run: npm run build
      - name: Check generated files
        run: npm run check
      - name: Test
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/inna-volos

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
